name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: leaseweb
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private source monorepo
        uses: actions/checkout@v4
        with:
          repository: ATT-IT-Cloud-Services/ignite-containers-monorepo
          token: ${{ secrets.MONOREPO_TOKEN }}
          path: monorepo
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: monorepo
      - run: cargo test --locked --manifest-path monorepo/Cargo.toml -p ignite-containers-client
