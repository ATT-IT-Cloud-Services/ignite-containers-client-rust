[package]
name = "ignite-containers-client"
version = "1.0.0"
edition = "2021"
license = "LicenseRef-ATT-IT-AS-IS-COMMERCIAL"
description = "Async Rust client for the Ignite Containers control plane API"
repository = "https://github.com/ATT-IT-Cloud-Services/ignite-containers-client-rust"
authors = ["Ignite Containers Contributors"]
readme = "README.md"
rust-version = "1.85"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
